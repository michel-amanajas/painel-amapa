# Este arquivo deve ficar em: .github/workflows/atualizar.yml
# (dentro do seu repositório no GitHub — veja o passo a passo enviado no chat)
#
# O que ele faz: a cada 5 minutos, o próprio GitHub roda o script
# atualizar_apuracao.py na nuvem, e se o dados.json mudar, publica a
# atualização automaticamente. Você não precisa deixar nada rodando no
# seu computador, e isso não consome tokens do Claude nem custa dinheiro.

name: Atualizar apuração

on:
  schedule:
    # a cada 5 minutos (o GitHub pode atrasar um pouco em horários de pico,
    # mas para repositórios públicos é gratuito e sem limite prático de uso
    # para uma tarefa deste tamanho)
    - cron: "*/5 * * * *"
  workflow_dispatch: {}  # permite rodar manualmente pelo botão "Run workflow"

permissions:
  contents: write  # necessário para o robô poder salvar o dados.json atualizado

jobs:
  atualizar:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Buscar dados do TSE
        run: python atualizar_apuracao.py --once

      - name: Publicar dados.json atualizado (se mudou)
        run: |
          git config user.name "robo-apuracao"
          git config user.email "robo-apuracao@users.noreply.github.com"
          git add dados.json
          git diff --cached --quiet || git commit -m "Atualiza dados.json"
          git push
